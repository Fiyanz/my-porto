services:
  # ------------------------------------
  # 1. Backend (FastAPI)
  # ------------------------------------
  - type: web
    name: portofolio-backend
    env: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    plan: free # Use free tier
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portofolio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false # You must set this manually in Render dashboard

  # ------------------------------------
  # 2. Frontend (Next.js)
  # ------------------------------------
  - type: web
    name: portofolio-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        # In production, frontend will talk directly to the backend's Render URL
        # instead of going through Nginx.
        # Format is usually https://<backend-name>.onrender.com
        value: https://portofolio-backend.onrender.com

databases:
  # ------------------------------------
  # 3. PostgreSQL Database
  # ------------------------------------
  - name: portofolio-db
    plan: free
    databaseName: portfolio
    user: postgres
